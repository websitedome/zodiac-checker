<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zodiac Sign & Personality Finder</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        /* Full Animated Rainbow Background */
        @keyframes rainbow-bg {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animated-rainbow-bg {
            background: linear-gradient(-45deg, #ff5e62, #ff9966, #ff758c, #ff7eb3, #7f7fd5, #86a8e7, #91eae4);
            background-size: 400% 400%;
            animation: rainbow-bg 12s ease infinite;
        }

        /* Floating Animation */
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-6px); }
        }
        .animate-float {
            animation: float 4s ease-in-out infinite;
        }

        /* Rainbow Border Glow */
        @keyframes rainbow-border {
            0% { filter: hue-rotate(0deg); }
            100% { filter: hue-rotate(360deg); }
        }
        .rainbow-glow {
            position: relative;
            border-radius: 1.75rem;
            background: linear-gradient(60deg, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #8b00ff);
            background-size: 400% 400%;
            animation: rainbow-border 8s linear infinite;
            padding: 3px;
        }

        /* Pop-Up Animation for Results */
        @keyframes popUp {
            0% { opacity: 0; transform: scale(0.9) translateY(15px); }
            70% { transform: scale(1.02) translateY(-3px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
        .animate-popup {
            animation: popUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
    </style>
</head>
<body class="animated-rainbow-bg min-h-screen flex items-center justify-center text-white px-4 py-8 overflow-x-hidden font-sans">

    <!-- Main Card Container with Rainbow Border -->
    <div class="rainbow-glow max-w-lg w-full shadow-2xl animate-float">
        <div class="bg-slate-950/90 backdrop-blur-2xl rounded-[calc(1.75rem-3px)] p-8">
            
            <!-- Top UI Header -->
            <div class="text-center mb-6">
                <span class="inline-block px-3 py-1 mb-2 text-xs font-extrabold tracking-wider text-pink-300 uppercase bg-pink-500/10 border border-pink-500/30 rounded-full shadow-inner">
                    ✨ Astrology & Personality ✨
                </span>
                <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-pink-400 via-purple-300 to-cyan-300">
                    Zodiac Sign Checker
                </h1>
                <p class="text-slate-300 text-sm mt-1.5 font-medium">Pick your birthdate or browse any sign below!</p>
            </div>

            <!-- Form / Input Section -->
            <div class="space-y-4">
                <div>
                    <label for="birthdate" class="block text-xs font-bold text-pink-300 uppercase tracking-wide mb-1.5">Select your birthdate:</label>
                    <input type="date" id="birthdate" 
                        class="w-full px-4 py-3.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white font-medium focus:outline-none focus:ring-2 focus:ring-pink-400 focus:border-transparent transition shadow-inner">
                </div>

                <button onclick="checkZodiac()" 
                    class="w-full py-3.5 bg-gradient-to-r from-pink-500 via-purple-600 to-indigo-600 hover:opacity-95 active:scale-95 font-bold rounded-xl shadow-lg shadow-purple-500/30 transition duration-150 cursor-pointer text-base">
                    🚀 Reveal My Sign & Personality
                </button>

                <!-- Divider -->
                <div class="relative flex py-2 items-center">
                    <div class="flex-grow border-t border-slate-800"></div>
                    <span class="flex-shrink mx-4 text-xs uppercase tracking-widest font-bold text-indigo-300">Or Browse All</span>
                    <div class="flex-grow border-t border-slate-800"></div>
                </div>

                <!-- Browse All Zodiac Signs Dropdown Menu -->
                <div>
                    <label for="zodiacSelect" class="block text-xs font-bold text-cyan-300 uppercase tracking-wide mb-1.5">Select any Zodiac Sign:</label>
                    <select id="zodiacSelect" onchange="selectZodiacFromDropdown()"
                        class="w-full px-4 py-3.5 bg-slate-900/90 border border-slate-700/80 rounded-xl text-white font-medium focus:outline-none focus:ring-2 focus:ring-cyan-400 focus:border-transparent transition shadow-inner cursor-pointer">
                        <option value="" disabled selected>✨ Choose a sign to explore...</option>
                        <option value="Aries">♈ Aries (Mar 21 - Apr 19)</option>
                        <option value="Taurus">♉ Taurus (Apr 20 - May 20)</option>
                        <option value="Gemini">♊ Gemini (May 21 - Jun 20)</option>
                        <option value="Cancer">♋ Cancer (Jun 21 - Jul 22)</option>
                        <option value="Leo">♌ Leo (Jul 23 - Aug 22)</option>
                        <option value="Virgo">♍ Virgo (Aug 23 - Sep 22)</option>
                        <option value="Libra">♎ Libra (Sep 23 - Oct 22)</option>
                        <option value="Scorpio">♏ Scorpio (Oct 23 - Nov 21)</option>
                        <option value="Sagittarius">♐ Sagittarius (Nov 22 - Dec 21)</option>
                        <option value="Capricorn">♑ Capricorn (Dec 22 - Jan 19)</option>
                        <option value="Aquarius">♒ Aquarius (Jan 20 - Feb 18)</option>
                        <option value="Pisces">♓ Pisces (Feb 19 - Mar 20)</option>
                    </select>
                </div>
            </div>

            <!-- Result Section (Hidden by default) -->
            <div id="result" class="mt-6 hidden border-t border-slate-800/80 pt-6 text-center animate-popup space-y-4">
                <div>
                    <div id="zodiacIcon" class="text-6xl mb-1 animate-bounce"></div>
                    <h2 id="zodiacName" class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-pink-300 to-cyan-300"></h2>
                    <p id="zodiacDates" class="text-xs text-indigo-300 uppercase tracking-widest mt-1 font-bold"></p>
                </div>
                
                <!-- Quick Info Cards -->
                <div class="grid grid-cols-2 gap-3 text-left">
                    <div class="bg-slate-900/70 rounded-xl p-3 border border-slate-800 shadow-sm">
                        <p class="text-xs text-pink-400 uppercase font-extrabold tracking-wide">Element</p>
                        <p id="zodiacElement" class="text-sm font-semibold mt-0.5 text-slate-100"></p>
                    </div>
                    <div class="bg-slate-900/70 rounded-xl p-3 border border-slate-800 shadow-sm">
                        <p class="text-xs text-pink-400 uppercase font-extrabold tracking-wide">Ruling Planet</p>
                        <p id="zodiacPlanet" class="text-sm font-semibold mt-0.5 text-slate-100"></p>
                    </div>
                </div>

                <!-- Deep Personality Section -->
                <div class="bg-slate-900/70 rounded-xl p-4 border border-slate-800 text-left space-y-3 shadow-sm">
                    <div>
                        <h3 class="text-xs font-extrabold text-pink-300 uppercase tracking-wide">💖 Your Vibe (Who You Are)</h3>
                        <p id="zodiacVibe" class="text-sm text-slate-200 mt-0.5 font-medium leading-relaxed"></p>
                    </div>
                    <div>
                        <h3 class="text-xs font-extrabold text-emerald-300 uppercase tracking-wide">🔥 Superpowers (Your Strengths)</h3>
                        <p id="zodiacStrengths" class="text-sm text-slate-200 mt-0.5 font-medium leading-relaxed"></p>
                    </div>
                    <div>
                        <h3 class="text-xs font-extrabold text-amber-300 uppercase tracking-wide">⚡ Blind Spots (Watch Out For)</h3>
                        <p id="zodiacShadow" class="text-sm text-slate-200 mt-0.5 font-medium leading-relaxed"></p>
                    </div>
                </div>

                <!-- Copy Button -->
                <button onclick="copyZodiacDetails()" id="copyBtn"
                    class="w-full py-3 bg-slate-900 hover:bg-slate-800 active:scale-95 border border-slate-700 text-pink-300 hover:text-white font-bold rounded-xl transition duration-150 cursor-pointer flex items-center justify-center gap-2 text-sm shadow">
                    📋 Copy My Zodiac Details
                </button>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        const zodiacData = {
            Aries: {
                symbol: "♈", element: "Fire", planet: "Mars", dates: "Mar 21 - Apr 19",
                vibe: "You are bold, energetic, and love being first. You jump straight into action and hate waiting around.",
                strengths: "Super brave, full of energy, very confident, and always ready to lead.",
                shadow: "You can get impatient quickly, lose your temper easily, and act without thinking."
            },
            Taurus: {
                symbol: "♉", element: "Earth", planet: "Venus", dates: "Apr 20 - May 20",
                vibe: "You love peace, comfort, and good vibes. You enjoy relaxing and treating yourself to nice things.",
                strengths: "Super reliable, very patient, practical, and fiercely loyal to your friends.",
                shadow: "You can be very stubborn, hate sudden changes, and sometimes lazy."
            },
            Gemini: {
                symbol: "♊", element: "Air", planet: "Mercury", dates: "May 21 - Jun 20",
                vibe: "You are super smart, chatty, and curious about everything. You get bored easily and love fun conversations.",
                strengths: "Quick learner, super adaptable, great at talking, and very fun to be around.",
                shadow: "You change your mind a lot, can be flaky, and struggle to focus on one thing."
            },
            Cancer: {
                symbol: "♋", element: "Water", planet: "Moon", dates: "Jun 21 - Jul 22",
                vibe: "You have a huge heart and care deeply about the people close to you. Your feelings run very deep.",
                strengths: "Incredibly caring, great listener, deeply protective, and very imaginative.",
                shadow: "Your mood can shift fast, you hold onto past hurts, and you hide when stressed."
            },
            Leo: {
                symbol: "♌", element: "Fire", planet: "Sun", dates: "Jul 23 - Aug 22",
                vibe: "You are the life of the party! Warm, bright, and love bringing happiness and fun energy everywhere.",
                strengths: "Natural born leader, very creative, extremely generous, and fearless.",
                shadow: "You can be a bit dramatic, love attention too much, and can act bossy."
            },
            Virgo: {
                symbol: "♍", element: "Earth", planet: "Mercury", dates: "Aug 23 - Sep 22",
                vibe: "You are the problem solver who notices every little detail. You love keeping things neat and helpful.",
                strengths: "Super smart, hardworking, extremely organized, and always ready to help.",
                shadow: "You overthink everything, judge yourself too harshly, and stress over tiny flaws."
            },
            Libra: {
                symbol: "♎", element: "Air", planet: "Venus", dates: "Sep 23 - Oct 22",
                vibe: "You are a total people person who loves harmony, beauty, and fair treatment for everyone.",
                strengths: "Great peacemaker, very charming, super polite, and fair-minded.",
                shadow: "You hate saying 'no' to people, avoid arguments at all costs, and can't make up your mind."
            },
            Scorpio: {
                symbol: "♏", element: "Water", planet: "Pluto", dates: "Oct 23 - Nov 21",
                vibe: "You are intense, mysterious, and feel things on a whole different level. You see right through fake people.",
                strengths: "Super loyal, deeply passionate, incredibly brave, and fiercely protective.",
                shadow: "You keep too many secrets, hold grudges forever, and can be overly jealous."
            },
            Sagittarius: {
                symbol: "♐", element: "Fire", planet: "Jupiter", dates: "Nov 22 - Dec 21",
                vibe: "You are a free-spirited explorer who loves freedom, fun adventures, and learning about the world.",
                strengths: "Super positive, hilarious, very open-minded, and always ready for an adventure.",
                shadow: "You can be too blunt with your words, get restless fast, and promise too much."
            },
            Capricorn: {
                symbol: "♑", element: "Earth", planet: "Saturn", dates: "Dec 22 - Jan 19",
                vibe: "You are a hard worker with big goals. You turn your dreams into real-life success step by step.",
                strengths: "Super disciplined, highly responsible, very smart with money, and dependable.",
                shadow: "You work way too much, hide your emotions, and can be way too serious."
            },
            Aquarius: {
                symbol: "♒", element: "Air", planet: "Uranus", dates: "Jan 20 - Feb 18",
                vype: "You march to the beat of your own drum! Unique, futuristic, and care a lot about making the world better.",
                strengths: "Very original, super smart, open-minded, and proudly unique.",
                shadow: "You can seem emotionally cold, act completely unpredictable, and rebel just to rebel."
            },
            Pisces: {
                symbol: "♓", element: "Water", planet: "Neptune", dates: "Feb 19 - Mar 20",
                vibe: "You are a dreamy, creative soul who lives partly in your own imagination. Super gentle and kind.",
                strengths: "Incredibly empathetic, deeply artistic, very intuitive, and sweet.",
                shadow: "You try to escape reality too often, trust the wrong people, and let stress drown you."
            }
        };

        let currentResultText = "";

        function checkZodiac() {
            const inputVal = document.getElementById('birthdate').value;
            if (!inputVal) {
                alert("Please select a valid birthdate!");
                return;
            }

            const date = new Date(inputVal);
            const month = date.getMonth() + 1;
            const day = date.getDate();

            const signName = getZodiacSignName(month, day);
            const data = zodiacData[signName];
            
            // Reset dropdown state
            document.getElementById('zodiacSelect').value = "";
            displayResult(signName, data);
        }

        function selectZodiacFromDropdown() {
            const selectedSign = document.getElementById('zodiacSelect').value;
            if (!selectedSign) return;

            const data = zodiacData[selectedSign];
            // Clear date picker state
            document.getElementById('birthdate').value = "";
            displayResult(selectedSign, data);
        }

        function getZodiacSignName(month, day) {
            if ((month == 3 && day >= 21) || (month == 4 && day <= 19)) return "Aries";
            if ((month == 4 && day >= 20) || (month == 5 && day <= 20)) return "Taurus";
            if ((month == 5 && day >= 21) || (month == 6 && day <= 20)) return "Gemini";
            if ((month == 6 && day >= 21) || (month == 7 && day <= 22)) return "Cancer";
            if ((month == 7 && day >= 23) || (month == 8 && day <= 22)) return "Leo";
            if ((month == 8 && day >= 23) || (month == 9 && day <= 22)) return "Virgo";
            if ((month == 9 && day >= 23) || (month == 10 && day <= 22)) return "Libra";
            if ((month == 10 && day >= 23) || (month == 11 && day <= 21)) return "Scorpio";
            if ((month == 11 && day >= 22) || (month == 12 && day <= 21)) return "Sagittarius";
            if ((month == 12 && day >= 22) || (month == 1 && day <= 19)) return "Capricorn";
            if ((month == 1 && day >= 20) || (month == 2 && day <= 18)) return "Aquarius";
            return "Pisces";
        }

        function displayResult(name, data) {
            document.getElementById('zodiacIcon').innerText = data.symbol;
            document.getElementById('zodiacName').innerText = name;
            document.getElementById('zodiacDates').innerText = data.dates;
            document.getElementById('zodiacElement').innerText = data.element;
            document.getElementById('zodiacPlanet').innerText = data.planet;
            
            document.getElementById('zodiacVibe').innerText = data.vibe;
            document.getElementById('zodiacStrengths').innerText = data.strengths;
            document.getElementById('zodiacShadow').innerText = data.shadow;

            currentResultText = `✨ Zodiac & Personality Profile: ${data.symbol} ${name} ✨\nDates: ${data.dates}\nElement: ${data.element}\nRuling Planet: ${data.planet}\n\n💖 Vibe: ${data.vibe}\n🔥 Strengths: ${data.strengths}\n⚡ Blind Spots: ${data.shadow}`;

            document.getElementById('result').classList.remove('hidden');
        }

        function copyZodiacDetails() {
            navigator.clipboard.writeText(currentResultText).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.innerText = "✅ Copied Successfully!";
                btn.classList.add('bg-emerald-600/40', 'border-emerald-500', 'text-emerald-300');
                
                setTimeout(() => {
                    btn.innerText = "📋 Copy My Zodiac Details";
                    btn.classList.remove('bg-emerald-600/40', 'border-emerald-500', 'text-emerald-300');
                }, 2000);
            });
        }
    </script>
</body>
</html>
